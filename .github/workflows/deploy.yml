name: Deploy Astro to OVH via SFTP

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build Astro site
        run: npm run build

      - name: Check remote SFTP paths
        env:
          SSHPASS: ${{ secrets.FABRLT_FTP_PASSWORD }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y sshpass

          printf "pwd\nls -la\nls -la /home\nls -la /home/fabienrawj\nls -la /home/fabienrawj/www\nls -la /home/fabienrawj/www/portfolio\nbye\n" | \
            sshpass -e sftp \
            -o StrictHostKeyChecking=no \
            -P 22 \
            "${{ secrets.FABRLT_FTP_LOGIN }}@${{ secrets.FABRLT_FTP_SERVER }}"

      - name: Deploy to OVH via SFTP
        uses: wlixcc/SFTP-Deploy-Action@v1.2.6
        with:
          username: ${{ secrets.FABRLT_FTP_LOGIN }}
          server: ${{ secrets.FABRLT_FTP_SERVER }}
          password: ${{ secrets.FABRLT_FTP_PASSWORD }}
          local_path: './dist/*'
          remote_path: '/www/portfolio/'
          port: 22
          sftp_only: true